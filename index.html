<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ดาวน์โหลดรูปภาพฟรีภายในงาน - ชมรมปัญญาชน คนสร้างฝัน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #060913; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        .glow-emerald { box-shadow: 0 0 25px -5px rgba(16, 185, 129, 0.3); }
    </style>
</head>
<body class="text-slate-100 min-h-screen pb-32 selection:bg-emerald-500 selection:text-slate-950">

    <div class="bg-gradient-to-r from-emerald-950 via-teal-900 to-amber-950 border-b border-emerald-500/40 py-2.5 px-4 text-center shadow-lg sticky top-0 z-50">
        <div class="container mx-auto flex items-center justify-center gap-2 text-xs font-bold tracking-wider text-emerald-300">
            <i class="fa-solid fa-code text-amber-400 animate-pulse"></i>
            <span>พัฒนาระบบโดย <span class="text-amber-300 font-black underline decoration-emerald-500/60 underline-offset-4">Supakit Ketsuwan</span></span>
            <i class="fa-solid fa-cloud-arrow-down text-emerald-400"></i>
        </div>
    </div>

    <header class="bg-slate-900/90 border-b border-emerald-900/50 py-5 px-6 flex flex-col sm:flex-row justify-between items-center gap-3 shadow-xl backdrop-blur-md">
        <div>
            <h1 class="text-xl sm:text-2xl font-black bg-gradient-to-r from-emerald-400 via-teal-300 to-amber-400 bg-clip-text text-transparent flex items-center gap-2.5">
                <i class="fa-solid fa-camera-retro text-amber-400"></i>
                ดาวน์โหลดรูปภาพงานฟรี
            </h1>
            <p class="text-xs text-emerald-200/80 mt-0.5">งานครบรอบ 23 ปีชมรม • ปัญญาชน คนสร้างฝัน</p>
        </div>
        <div class="flex items-center gap-2">
            <span class="px-3 py-1.5 bg-emerald-950 border border-emerald-500/40 text-emerald-300 text-xs font-bold rounded-xl shadow-inner flex items-center gap-1.5">
                <i class="fa-solid fa-circle-check text-emerald-400"></i> โหลดฟรีไม่จำกัด
            </span>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8 max-w-4xl space-y-6">
        <section class="bg-slate-900/80 rounded-3xl p-6 shadow-2xl border border-slate-800 backdrop-blur-xl glow-emerald">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-6 pb-4 border-b border-slate-800 gap-4">
                <div>
                    <h2 class="text-lg font-bold text-emerald-400 flex items-center gap-2">
                        <i class="fa-solid fa-folder-open text-amber-400"></i> เลือกอัลบั้มรูปภาพ
                    </h2>
                    <p class="text-xs text-slate-400 mt-0.5">คลิกเลือกติ๊กถูกที่รูปที่ต้องการ แล้วกดดาวน์โหลดด้านล่างสุดได้เลยครับ</p>
                </div>
                <div id="albumTabs" class="flex items-center gap-2 overflow-x-auto pb-2 sm:pb-0"></div>
            </div>

            <div id="photoGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                <div class="col-span-full text-center py-16 text-slate-500 font-bold">กำลังเชื่อมต่อฐานข้อมูลภาพ...</div>
            </div>
        </section>
    </main>

    <!-- Floating Download Bar -->
    <div id="floatingBar" class="fixed bottom-0 left-0 right-0 bg-slate-900/95 border-t border-slate-800 p-4 backdrop-blur-md z-40 shadow-2xl hidden transition-all duration-300">
        <div class="container mx-auto max-w-4xl flex items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-emerald-500/20 border border-emerald-500/50 flex items-center justify-center text-emerald-400 font-black text-lg shadow-inner" id="selectedCount">0</div>
                <div>
                    <div class="text-xs text-slate-400 font-medium">เลือกรูปไว้แล้ว</div>
                    <div class="text-sm font-bold text-emerald-300">พร้อมดาวน์โหลดลงเครื่อง</div>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button type="button" onclick="clearSelection()" class="px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl text-xs cursor-pointer transition-all">ยกเลิก</button>
                <button type="button" onclick="downloadSelectedPhotos()" class="px-6 py-3 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-black rounded-xl shadow-lg flex items-center gap-2 text-xs sm:text-sm active:scale-95 transition-all cursor-pointer">
                    <i class="fa-solid fa-download text-amber-300"></i>
                    <span>ดาวน์โหลดรูปที่เลือก (<span id="btnCount">0</span>)</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwSrna0nYGWs2dE7yr1OYMmr1ddDIrHNE-ahEq2E77jU9_pTWtna-MnljGIBH6IUxXw/exec";

        let albumsData = {};
        let activeAlbumId = null;
        let selectedPhotos = {};

        function loadData() {
            fetch(WEB_APP_URL)
            .then(res => res.json())
            .then(data => {
                albumsData = data.albums || {};
                renderTabs();
            })
            .catch(err => {
                console.error('Error:', err);
                document.getElementById('photoGrid').innerHTML = `<div class="col-span-full text-center py-12 text-red-400 font-bold text-xs">ไม่สามารถเชื่อมต่อฐานข้อมูลรูปภาพได้ กรุณารีเฟรช</div>`;
            });
        }

        function renderTabs() {
            const tabsContainer = document.getElementById('albumTabs');
            const keys = Object.keys(albumsData);

            if (keys.length === 0) {
                tabsContainer.innerHTML = `<span class="text-xs text-slate-500 font-bold">ยังไม่มีอัลบั้มในระบบ</span>`;
                document.getElementById('photoGrid').innerHTML = `<div class="col-span-full text-center py-16 text-slate-500 font-bold">ยังไม่มีรูปภาพอัปโหลดในระบบขณะนี้</div>`;
                return;
            }

            if (!activeAlbumId || !albumsData[activeAlbumId]) {
                activeAlbumId = keys[0];
            }

            let html = '';
            keys.forEach(id => {
                const album = albumsData[id];
                const isActive = id === activeAlbumId;
                html += `
                    <button type="button" onclick="selectAlbum('${id}')" class="px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all cursor-pointer ${isActive ? 'bg-emerald-500 text-slate-950 shadow-lg font-black' : 'bg-slate-950 text-slate-300 border border-slate-800 hover:border-emerald-500/50'}">
                        <i class="fa-solid fa-folder-open mr-1.5"></i>${album.name}
                    </button>
                `;
            });
            tabsContainer.innerHTML = html;
            renderPhotos();
        }

        function selectAlbum(id) {
            activeAlbumId = id;
            renderTabs();
        }

        function renderPhotos() {
            const grid = document.getElementById('photoGrid');
            const album = albumsData[activeAlbumId];

            if (!album || !album.photos || Object.keys(album.photos).length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-16 text-slate-500 font-bold">อัลบั้มนี้ยังไม่มีรูปถ่าย</div>`;
                return;
            }

            let html = '';
            Object.entries(album.photos).forEach(([photoId, photo]) => {
                const isSelected = selectedPhotos[photoId] ? true : false;
                html += `
                    <div onclick="toggleSelect('${photoId}')" class="group relative bg-slate-950 border-2 rounded-2xl overflow-hidden shadow-lg cursor-pointer transition-all duration-200 ${isSelected ? 'border-emerald-500 scale-[0.98] ring-2 ring-emerald-500/40' : 'border-slate-800 hover:border-slate-700'}">
                        <div class="relative w-full h-40 sm:h-48 bg-slate-900 flex items-center justify-center p-1">
                            <img src="${photo.url}" class="w-full h-full object-cover rounded-xl transition-transform duration-300 group-hover:scale-105">
                            <div class="absolute top-2.5 left-2.5 w-7 h-7 rounded-xl flex items-center justify-center text-xs shadow transition-all ${isSelected ? 'bg-emerald-500 text-slate-950 font-black' : 'bg-slate-950/80 text-slate-400 border border-slate-700'}">
                                ${isSelected ? '<i class="fa-solid fa-check"></i>' : '<i class="fa-regular fa-circle"></i>'}
                            </div>
                            <div class="absolute bottom-2.5 right-2.5 bg-slate-950/90 px-2.5 py-0.5 rounded-lg text-[10px] font-black text-amber-400 border border-amber-500/30">
                                ${photo.code || '#IMG'}
                            </div>
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;
            updateFloatingBar();
        }

        function toggleSelect(photoId) {
            if (selectedPhotos[photoId]) {
                delete selectedPhotos[photoId];
            } else {
                for (let aId in albumsData) {
                    if (albumsData[aId].photos && albumsData[aId].photos[photoId]) {
                        selectedPhotos[photoId] = albumsData[aId].photos[photoId];
                        break;
                    }
                }
            }
            renderPhotos();
        }

        function clearSelection() {
            selectedPhotos = {};
            renderPhotos();
        }

        function updateFloatingBar() {
            const count = Object.keys(selectedPhotos).length;
            const bar = document.getElementById('floatingBar');
            document.getElementById('selectedCount').textContent = count;
            document.getElementById('btnCount').textContent = count;

            if (count > 0) {
                bar.classList.remove('hidden');
            } else {
                bar.classList.add('hidden');
            }
        }

        function downloadSelectedPhotos() {
            const items = Object.values(selectedPhotos);
            if (items.length === 0) return;

            alert(`กำลังเริ่มดาวน์โหลดรูปภาพจำนวน ${items.length} รูป กรุณารอสักครู่...`);

            items.forEach((photo, index) => {
                setTimeout(() => {
                    const a = document.createElement('a');
                    a.href = photo.url;
                    a.download = `Photo_${photo.code || index + 1}.jpg`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                }, index * 400);
            });
        }

        loadData();
    </script>
</body>
</html>
